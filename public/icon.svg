<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tlp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#tlp-grad)" />

  <!-- Inner glass card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.35" stroke-width="8" />

  <!-- The Living Clover Emblem -->
  <g transform="translate(128, 128) scale(8)" filter="url(#shadow)">
    <!-- Top Petal -->
    <path d="M16 4.5C18.2 4.5 20.2 6.5 20.2 9C20.2 12.2 16 15 16 15C16 15 11.8 12.2 11.8 9C11.8 6.5 13.8 4.5 16 4.5Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Bottom Petal -->
    <path d="M16 27.5C13.8 27.5 11.8 25.5 11.8 23C11.8 19.8 16 17 16 17C16 17 20.2 19.8 20.2 23C20.2 25.5 18.2 27.5 16 27.5Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Left Petal -->
    <path d="M4.5 16C4.5 13.8 6.5 11.8 9 11.8C12.2 11.8 15 16 15 16C15 16 12.2 20.2 9 20.2C6.5 20.2 4.5 18.2 4.5 16Z" fill="#FFFFFF" fill-opacity="0.88" />
    <!-- Right Petal -->
    <path d="M27.5 16C27.5 18.2 25.5 20.2 23 20.2C19.8 20.2 17 16 17 16C17 16 19.8 11.8 23 11.8C25.5 11.8 27.5 13.8 27.5 16Z" fill="#FFFFFF" fill-opacity="0.88" />

    <!-- Central Ring -->
    <circle cx="16" cy="16" r="4" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" />
    <!-- Center Core -->
    <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
